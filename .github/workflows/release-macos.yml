name: Release macOS

# 只负责 macOS 产物。与 Windows 工作流相互独立：
# 任何一方排队或失败，都不影响另一方发布。

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "要发布的 tag（例如 v0.1.1）"
        required: true

permissions:
  contents: write

jobs:
  macos:
    name: macOS 产物
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0

      - name: 解析版本
        id: meta
        shell: bash
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: 测试
        working-directory: macos
        run: swift test --disable-sandbox

      - name: 打包
        run: ./macos/Scripts/package-app.sh "${{ steps.meta.outputs.version }}"

      - uses: actions/upload-artifact@v4
        with:
          name: macos-dist
          path: |
            macos/dist/*.zip
            macos/dist/*.dmg
          if-no-files-found: error

      - name: 生成更新说明
        uses: ./.github/actions/release-notes
        with:
          version: ${{ steps.meta.outputs.version }}

      - name: 发布
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.meta.outputs.tag }}"
          shopt -s nullglob
          ASSETS=(macos/dist/*.zip macos/dist/*.dmg)
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "没有可上传的产物"
            exit 1
          fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release 已存在，补传 macOS 产物"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            # 两个平台可能同时创建，失败则退回补传。
            gh release create "$TAG" "${ASSETS[@]}" \
              --title "AItrans $TAG" --notes-file release-notes.md \
              || gh release upload "$TAG" "${ASSETS[@]}" --clobber
          fi
          gh release view "$TAG" --json assets --jq '.assets[] | "\(.name) \(.size)"'
