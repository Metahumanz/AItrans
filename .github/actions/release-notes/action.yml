name: 生成 Release 说明
description: 写入 release-notes.md：首次打开说明、按版本区间的升级提示，以及本次提交列表。

inputs:
  version:
    description: 发布版本号（不带 v 前缀）
    required: true

runs:
  using: composite
  steps:
    - name: 写入 release-notes.md
      shell: bash
      env:
        VERSION: ${{ inputs.version }}
      run: |
        {
          echo "未签名版本，首次打开需要手动放行："
          echo
          echo "- macOS：右键点 App →「打开」，或到「系统设置 → 隐私与安全性」点「仍要打开」；"
          echo "- Windows：SmartScreen 里点「更多信息」→「仍要运行」。"
          echo
          # 钥匙串 → secrets.json 的迁移只影响 0.3.x；之后的版本不再重复这段提示。
          case "$VERSION" in
            0.3.*)
              echo "## 升级提示"
              echo
              echo "- macOS：v0.3.2 起 API Key 改存本地 \`secrets.json\`（明文，0600），不再使用钥匙串；从 v0.3.1 及更早版本升级后，旧钥匙串里的 Key 不会自动迁移，请在「提供商」里重新填写一次。"
              echo "- Windows：密钥由 DPAPI 加密保存，无需操作。"
              echo
              ;;
          esac
          echo "## 变更"
          echo
          git log --no-merges --pretty=format:'- %s' "$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo HEAD~10)..HEAD" 2>/dev/null || git log --no-merges --pretty=format:'- %s' -n 20
        } > release-notes.md
